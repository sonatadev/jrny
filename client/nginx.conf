# Le pagine di condivisione pubblica espongono i nomi dei partecipanti e non
# devono finire negli indici. Serve $request_uri (non $uri): try_files fa un
# redirect interno a /index.html, che azzererebbe un match su $uri.
map $request_uri $robots_tag {
    default          "";
    ~^/share/        "noindex, nofollow, noarchive";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Non rivelare la versione di nginx nelle risposte e nelle pagine d'errore
    server_tokens off;

    location /api/ {
        proxy_pass http://server:3090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        # Allineato ai limiti multer (max 20MB per allegati/biglietti) + margine per
        # l'overhead multipart, così gli upload grandi non vengono troncati dal proxy.
        client_max_body_size 22M;
        # Gli header li imposta Express: qui nessun add_header, altrimenti la
        # CSP dei documenti si sommerebbe a quella delle risposte API.
    }

    location /uploads/ {
        proxy_pass http://server:3090/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        # Idem: /uploads risponde con la propria CSP "default-src 'none'; sandbox"
    }

    # Service worker must never be cached
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # Manifest
    location = /manifest.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
