# Header di sicurezza per i documenti dell'app (non per /api/ e /uploads/,
# che impostano i propri: vedi server/index.js).
# Va incluso in OGNI location che usa add_header, perché add_header in una
# location sostituisce — non eredita — quelli del blocco server.

# La CSP è la rete di sicurezza contro il furto del token da localStorage:
# senza script-src 'self' un XSS avrebbe accesso pieno all'origin.
#  - style-src unsafe-inline: l'app usa massicciamente style={{...}} di React
#  - img-src https:: le copertine dei viaggi possono essere URL incollati
#    dall'utente (Unsplash e simili), quindi non è restringibile a una lista
#  - connect-src: solo le API effettivamente chiamate dal browser
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://nominatim.openstreetmap.org https://api.open-meteo.com https://geocoding-api.open-meteo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# origin-only verso terzi: identifica l'app a Nominatim senza rivelare il path
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# Valorizzato dalla map in nginx.conf solo per /share/ (vuoto = header omesso)
add_header X-Robots-Tag $robots_tag always;
