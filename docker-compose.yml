version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: jrny_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jrny_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jrny_server
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT:-3090}
      NODE_ENV: ${NODE_ENV:-production}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      TRIP_STORAGE_QUOTA_MB: ${TRIP_STORAGE_QUOTA_MB:-1024}
      APP_URL: ${APP_URL:-http://localhost:8090}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - jrny_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: jrny_client
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - server
    networks:
      - jrny_net
      - npm_network

networks:
  jrny_net:
    driver: bridge
  # DMZ per-app: rete dedicata condivisa solo con NPM
  npm_network:
    external: true
    name: jrny_edge

volumes:
  postgres_data:
  uploads_data:
